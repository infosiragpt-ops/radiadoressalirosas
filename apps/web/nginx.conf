# The host's HTTPS proxy supplies the client IP directly to the loopback listener.
map $http_x_real_ip $clau_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location ^~ /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $clau_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /data/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(store|nosotros|contacto|cart|my-account|recuperar-contrasena|admin)/?$ {
        try_files $uri /index.html;
    }

    location ~ ^/(producto|categoria-producto)/[^/]+/?$ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }
}
